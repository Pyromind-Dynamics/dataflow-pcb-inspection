name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_PROGRESS_BAR: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development environment
        run: |
          python -m venv "$RUNNER_TEMP/source-check"
          "$RUNNER_TEMP/source-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/source-check/bin/python" -m pip install -e '.[dev]'
          "$RUNNER_TEMP/source-check/bin/python" -m pip check
      - name: Test source
        run: '"$RUNNER_TEMP/source-check/bin/python" -m pytest -v'
      - name: Build and record resolved dependencies
        run: |
          "$RUNNER_TEMP/source-check/bin/python" -m build
          # Record this Python/Linux job's tested dependencies, excluding the
          # editable project so the next environment must install the wheel.
          "$RUNNER_TEMP/source-check/bin/python" -m pip freeze --exclude dataflow-pcb-inspection > "$RUNNER_TEMP/wheel-constraints.txt"
      - name: Verify wheel outside source tree
        run: |
          # Keep only one dependency environment on disk at a time. DataFlow's
          # Linux dependencies include large ML libraries even for offline tests.
          rm -rf "$RUNNER_TEMP/source-check"
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --constraint "$RUNNER_TEMP/wheel-constraints.txt" dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I -m dataflow_pcb_inspection.pipelines.demo --output "$RUNNER_TEMP/extension-demo"
      - name: Upload resolved dependency constraints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-constraints-py${{ matrix.python }}
          path: ${{ runner.temp }}/wheel-constraints.txt
          if-no-files-found: ignore
